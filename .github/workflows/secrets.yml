name: Secret Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 過去のコミット履歴も含めてスキャンするために必要
          fetch-depth: 0

      - name: Install Betterleaks
        run: bash scripts/install-betterleaks.sh

      - name: Add Betterleaks to PATH
        run: echo "$PWD/.betterleaks/bin" >> "$GITHUB_PATH"

      - name: Run Betterleaks scan
        run: betterleaks git . --redact
