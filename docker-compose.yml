services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cognito
      POSTGRES_PASSWORD: cognito
      POSTGRES_DB: cognito
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cognito -d cognito']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cognito:cognito@db:5432/cognito
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
